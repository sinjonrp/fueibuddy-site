# GitHub Pages へのデプロイ（main への push で自動実行）。
# Settings→Pages の手動有効化の代わりに、configure-pages の enablement で
# サイト作成を試みる（成功すれば公開URLが生きる）。
# 公開するのはサイト3ページのみ（.claude/ や README は公開物に含めない）。
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 公開ファイルを抽出
        run: |
          mkdir -p _site
          cp index.html privacy.html support.html _site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
