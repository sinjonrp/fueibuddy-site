# GitHub Pages へのデプロイ。
#
# ★ 2026-08-17: GSdesk 統合方針により、ふうえいバディ単体のストア提出とサイト公開は
#   停止中。単体アプリを並べると App Store ガイドライン4.3（重複アプリ）のリスクを
#   自分で作ることになるため。したがって push による自動実行は外してある。
#   （Pages 自体も未有効。有効化も統合方針の決着まで行わない）
#
# 公開を再開するときは、まず Settings→Pages の Source を GitHub Actions にしたうえで、
# 下の on: に push トリガーを戻すか、Actions タブから手動実行する。
# 公開するのはサイト3ページのみ（.claude/ や README は公開物に含めない）。
name: Deploy GitHub Pages

on:
  # 手動実行のみ（自動公開はしない）。
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 公開ファイルを抽出
        run: |
          mkdir -p _site
          cp index.html privacy.html support.html _site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
